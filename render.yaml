# Despliegue en Render (Blueprint). Un solo servicio: API + web (SPA) juntos.
services:
  - type: web
    name: tutoresonline
    runtime: node
    plan: free
    buildCommand: cd web && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && node --no-warnings src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: JWT_SECRET
        generateValue: true
